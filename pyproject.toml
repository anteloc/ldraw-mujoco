[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ldraw-mujoco"
version = "0.1.0"
description = "Import LDraw assemblies into MuJoCo with explicit physics approximations"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "pyldraw3==1.7.0",
    "mujoco==3.5.0",
    "numpy>=2.2,<3",
    "trimesh>=4.6,<5",
    "scipy>=1.15,<2",
    "pillow>=11,<13",
]

[project.scripts]
ldraw-mujoco = "ldraw_mujoco.cli:main"

[project.optional-dependencies]
interpreter = [
    "mcp==1.26.0",
    "prompt-toolkit>=3.0,<4",
    "mujoco-mcp-server @ git+https://github.com/anteloc/mujoco-mcp-server.git@3e249d3834322c49bf611e48903dd54871823de8",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14"]

[tool.setuptools.packages.find]
include = ["ldraw_mujoco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local sample data or optional interpreter dependencies"]

[tool.ruff]
line-length = 100
extend-exclude = ["data", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

